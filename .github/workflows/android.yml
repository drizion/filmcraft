# Builds the Android APK (apps/filmcraft-android, docs/mobile.md) with cargo-apk on a GitHub-hosted
# Ubuntu runner, which ships the Android SDK and NDK, and uploads it as a workflow artifact:
# Actions ▸ this run ▸ Artifacts ▸ FilmCraft-apk. The APK is signed with the Android debug key (local
# testing only, not the Play Store). `cargo xtask android check` runs first: it catches
# Android-only compile errors in seconds, before the long native build.
name: Android

on:
  push:
    branches: [main, "claude/**", "mobile/**"]
    paths:
      - "apps/filmcraft-android/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/filmcraft-android/**"
      - "crates/ui-egui/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Android SDK platform and NDK
        run: |
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: cargo-apk
        run: cargo install cargo-apk --locked
      - name: Check the Android target
        run: cargo xtask android check
      - name: Build the APK
        run: cargo xtask android build
      - name: Upload the APK
        # Dependabot (github-actions ecosystem) keeps this current; pin to a commit SHA like the other workflows.
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-apk
          path: target/android/*.apk
          if-no-files-found: error
          retention-days: 30
