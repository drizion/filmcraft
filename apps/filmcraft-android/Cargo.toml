[package]
name = "filmcraft-android"
description = "FilmCraft on Android: the engine and the touch UI in a NativeActivity (docs/mobile.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The one app crate with a single `unsafe`-flavoured item: the exported `android_main` entry point
# that android-activity's glue calls (docs/adr/0002-android-entry-point.md). The workspace lints,
# except that `unsafe_code` is `deny` instead of `forbid` so that one attribute can opt in.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[lib]
crate-type = ["cdylib"]

# Everything is android-only: on other targets this crate is empty, so `cargo test --workspace`
# and clippy stay cheap. Build with `cargo xtask android build` (docs/mobile.md).
[target.'cfg(target_os = "android")'.dependencies]
filmcraft-engine = { workspace = true }
filmcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
serde_json = { workspace = true }
log = { workspace = true }

# cargo-apk (https://github.com/rust-mobile/cargo-apk) reads this to build and sign the APK.
[package.metadata.android]
package = "ai.storyteller.filmcraft"
apk_name = "FilmCraft"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
# 34: apps targeting 35 are forced edge-to-edge; the shell handles insets later (docs/mobile-roadmap.md).
target_sdk_version = 34

[package.metadata.android.application]
label = "FilmCraft"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode|density|navigation"
launch_mode = "singleTop"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = true

# Import and export work on the user's media; microphone is for voice-over.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

# Local test builds: the release profile signed with the Android debug keystore that the Android
# SDK creates (`~/.android/debug.keystore`, password `android`). Not for the Play Store.
[package.metadata.android.signing.release]
path = "$HOME/.android/debug.keystore"
keystore_password = "android"
